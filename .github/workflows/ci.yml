name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shiftpatch
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shiftpatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shiftpatch -d shiftpatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shiftpatch:ci-only-password@localhost:5432/shiftpatch_test
      DATABASE_URL_UNPOOLED: postgresql://shiftpatch:ci-only-password@localhost:5432/shiftpatch_test
      TEST_DATABASE_URL: postgresql://shiftpatch:ci-only-password@localhost:5432/shiftpatch_test
      AUTH_SECRET: ci-only-signing-secret-at-least-32-characters-long
      CRON_SECRET: ci-only-cron-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
